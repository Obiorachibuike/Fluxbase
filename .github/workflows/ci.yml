name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # The Redis suites run for real against the service container above.
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (source, tests, examples)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (requires Redis)
        run: npm run test:redis -- --coverage

      - name: Build
        run: npm run build

      - name: Package verification (pack, install, ESM/CJS/types)
        run: npm run test:package

      - name: API docs
        run: npx typedoc

      - name: Upload coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/
          if-no-files-found: ignore
