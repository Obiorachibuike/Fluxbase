# Manual dry run. This workflow never publishes to npm. It runs the release checks,
# builds the tarball exactly as npm would pack it, and uploads it for inspection.
name: Release dry run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Release checks (typecheck, lint, tests, build, package verification)
        run: npm run release:dry-run

      - name: Pack tarball (not published)
        run: npm pack --pack-destination ./release-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: fluxbase-tarball-dry-run
          path: release-artifacts/*.tgz
          if-no-files-found: error
